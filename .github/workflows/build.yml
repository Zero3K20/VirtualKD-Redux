name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        working-directory: VirtualKD-Redux
    steps:
      - uses: actions/checkout@v4

      - name: Install VS 2022 Windows XP toolset (v141_xp) and ATL
        shell: pwsh
        working-directory: .
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vs`"", '--quiet', '--norestart', '--noUpdateInstaller',
            '--add', 'Microsoft.VisualStudio.Component.WinXP',
            '--add', 'Microsoft.VisualStudio.Component.VC.ATL',
            '--add', 'Microsoft.VisualStudio.Component.VC.ATL.ARM64')
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "VS installer failed: $($p.ExitCode)" }

      - name: Install Windows Driver Kit 7.1.0
        shell: pwsh
        working-directory: .
        timeout-minutes: 30
        run: |
          $iso = "$env:RUNNER_TEMP\wdk.iso"
          $dir = "$env:RUNNER_TEMP\wdk"
          $out = "$env:RUNNER_TEMP\wdkfiles"
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/4/A/2/4A25C7D5-EFBE-4182-B6A9-AE6850409A78/GRMWDK_EN_7600_1.ISO' -OutFile $iso
          7z x $iso "-o$dir" -y | Out-Null

          # KitSetup.exe is interactive and the MSIs do nothing when installed standalone,
          # so extract their files with an administrative install instead
          $msis = Get-ChildItem $dir -Recurse -Filter *.msi | Where-Object { $_.Name -notmatch 'ia64' }
          foreach ($msi in $msis) {
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$out`""
            if ($p.ExitCode -ne 0) { Write-Host "$($msi.Name): exit code $($p.ExitCode)" }
          }

          $ntddk = Get-ChildItem $out -Recurse -Filter ntddk.h -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\inc\\ddk$' } | Select-Object -First 1
          if (-not $ntddk) {
            Get-ChildItem $out -Recurse -Depth 3 -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "WDK extraction failed: ntddk.h not found under $out"
          }
          $wdk = $ntddk.Directory.Parent.Parent.FullName
          Write-Host "WDK root: $wdk"
          Get-ChildItem "$wdk\lib" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          "WDK7_PATH=$wdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install VirtualBox (provides the COM type library for VirtualBoxIntegration)
        shell: pwsh
        run: |
          choco install virtualbox -y --no-progress
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "VirtualBox install failed: $LASTEXITCODE" }

      - name: Generate code signing certificates
        shell: pwsh
        run: |
          $exp = (Get-Date).AddYears(10)
          $ca = New-SelfSignedCertificate -Subject 'CN=VirtualKD-Redux CA' -KeyAlgorithm RSA -KeyLength 4096 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -KeyUsage CertSign,CRLSign -TextExtension @('2.5.29.19={critical}{text}ca=true') -CertStoreLocation Cert:\CurrentUser\My -NotAfter $exp
          $spc = New-SelfSignedCertificate -Subject 'CN=VirtualKD-Redux SPC' -Type CodeSigningCert -Signer $ca -KeyAlgorithm RSA -KeyLength 4096 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -CertStoreLocation Cert:\CurrentUser\My -NotAfter $exp
          Export-Certificate -Cert $ca -FilePath Certs\VKD-Redux_CA.cer | Out-Null
          [IO.File]::WriteAllBytes("$PWD\Certs\VKD-Redux_SPC.pfx", $spc.Export([Security.Cryptography.X509Certificates.X509ContentType]::Pfx))

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          foreach ($cfg in 'Debug','Release') {
            foreach ($plat in 'Win32','x64') {
              msbuild /m VirtualKD-Redux.sln /property:Platform=$plat /property:Configuration=$cfg
              if ($LASTEXITCODE -ne 0) { throw "Build failed: $cfg|$plat" }
            }
          }

      - name: Create bundles
        shell: cmd
        run: call createbundles.bat

      - name: Create ZIP archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Zips | Out-Null
          Copy-Item ..\LICENSE, ..\README.md, Docs\Tutorial.md Bundles\ReleaseBundle\
          Compress-Archive -Path Bundles\ReleaseBundle\* -DestinationPath Zips\VirtualKD-Redux-Release.zip
          Compress-Archive -Path Bundles\DebugBundle\* -DestinationPath Zips\VirtualKD-Redux-Debug.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualKD-Redux
          path: VirtualKD-Redux/Zips/*.zip
